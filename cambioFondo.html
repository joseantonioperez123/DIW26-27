<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio de color de fondo</title>
    <style>
        main {
            display: flex;
            gap: 30px;
            padding: 20px;
        }

        section {
            flex: 1;
        }

        .botones {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 150px;
        }

        .botones button {
            padding: 12px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <main>
        <section>
            <h2>CONTENIDO PRINCIPAL</h2>
            <address>Cdd/Real</address>
            <addr>C/Prini,1 </addr>
        </section>
        <aside class="botones">
            <button id="rojo">Rojo</button>
            <button id="verde">Verde</button>
            <button id="azul">Azul</button>
        </aside>
    </main>
    
    <script>
        function setCookie(cname, cvalue, exdays) {
            const d = new Date();
            d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
            let expires = "expires="+d.toUTCString();
            document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
        }

        function getCookie(cname) {
            let name = cname + "=";
            let decodedCookie = decodeURIComponent(document.cookie);
            let ca = decodedCookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') {
                c = c.substring(1);
                }
                if (c.indexOf(name) == 0) {
                return c.substring(name.length, c.length);
                }
            }
            return "";
        }

        function checkCookie() {
        let user = getCookie("username");
        if (user != "") {
            alert("Welcome again " + user);
        } else {
            user = prompt("Please enter your name:", "");
            if (user != "" && user != null) {
            setCookie("username", user, 365);
            }
        }
    }


        let btnRojo=document.getElementById("rojo");
        let btnVerde=document.getElementById("verde");
        let btnAzul=document.getElementById("azul");

        function establecerColor(color) {
            let c;
            switch (color) {
                case 1: c="red";
                        break;
                case 2: c="green";
                        break;
                case 3: c="blue";
                        break;
            }
            //console.log
            setCookie("color", c, 1);
            document.body.style.backgroundColor=c;
        }

        btnRojo.addEventListener("click", () => establecerColor(1)); 
        btnVerde.addEventListener("click", () => establecerColor(2)); 
        btnAzul.addEventListener("click", () => establecerColor(3)); 

        let color=getCookie("color");
        if (color)
            document.body.style.backgroundColor=color;

    </script>
</body>
</html>
